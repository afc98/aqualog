name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: aqualog
          POSTGRES_PASSWORD: aqualog
          POSTGRES_DB: aqualog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqualog -d aqualog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AQUALOG_TEST_POSTGRES_URL: postgres://aqualog:aqualog@127.0.0.1:5432/aqualog_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
